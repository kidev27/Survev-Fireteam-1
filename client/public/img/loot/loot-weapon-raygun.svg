<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="tipGlow" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7dff6b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7dff6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b8ffad" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#7dff6b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7dff6b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-32 64 64) translate(-4 6)" stroke="#323232" stroke-width="2.4" stroke-linejoin="round">
    <!-- grip -->
    <path d="M33 60 L26 93 Q25 98 30 99 L41 100 Q46 100 46 95 L48 64 Z" fill="#c8202a"/>
    <path d="M31 70 L29 90" fill="none" stroke="#8e1219" stroke-width="2"/>
    <!-- trigger guard -->
    <path d="M48 64 Q50 80 60 76 L60 64" fill="none" stroke="#323232" stroke-width="3.2"/>
    <path d="M52 64 L54 72" fill="none" stroke="#323232" stroke-width="2.2"/>
    <!-- rear fins (chrome) -->
    <path d="M17 44 L8 38 L10 35 L20 41 Z" fill="#d7dbe0"/>
    <path d="M16 52 L5 52 L5 48 L16 48 Z" fill="#d7dbe0"/>
    <path d="M17 60 L8 66 L10 69 L20 63 Z" fill="#d7dbe0"/>
    <!-- main body -->
    <rect x="15" y="39" width="46" height="27" rx="11" fill="#d42a33"/>
    <path d="M22 60 H54" fill="none" stroke="#8e1219" stroke-width="2"/>
    <!-- dial -->
    <circle cx="31" cy="52" r="9.5" fill="#d7dbe0"/>
    <circle cx="31" cy="52" r="4.2" fill="#9aa2ab" stroke-width="1.6"/>
    <!-- gauge -->
    <path d="M42 40 A8 8 0 0 1 58 40 Z" fill="#f4f1e6"/>
    <path d="M44.5 39 A5.6 5.6 0 0 1 48 34.6" fill="none" stroke="#45c63a" stroke-width="2"/>
    <path d="M48 34.6 A5.6 5.6 0 0 1 52.5 34.8" fill="none" stroke="#f2c230" stroke-width="2"/>
    <path d="M52.5 34.8 A5.6 5.6 0 0 1 55.5 39" fill="none" stroke="#e5482e" stroke-width="2"/>
    <path d="M50 40 L46.5 35.5" fill="none" stroke="#323232" stroke-width="1.4"/>
    <!-- coil -->
    <rect x="60" y="43" width="22" height="19" rx="4" fill="#86d8f2"/>
    <path d="M65 44 V61 M70 44 V61 M75 44 V61" fill="none" stroke="#4aa3c9" stroke-width="2"/>
    <!-- barrel -->
    <rect x="81" y="48.5" width="29" height="8" rx="2" fill="#d42a33"/>
    <!-- gold fins -->
    <rect x="85" y="42" width="4" height="21" rx="1.5" fill="#f2c230"/>
    <rect x="93" y="44" width="4" height="17" rx="1.5" fill="#f2c230"/>
    <rect x="101" y="46" width="4" height="13" rx="1.5" fill="#f2c230"/>
    <!-- emitter -->
    <circle cx="119" cy="52.5" r="10" fill="url(#g)" stroke="none"/>
    <rect x="109" y="50.5" width="6" height="4" fill="#d7dbe0" stroke-width="1.8"/>
    <circle cx="119" cy="52.5" r="5" fill="#7dff6b"/>
    <circle cx="117.6" cy="51" r="1.6" fill="#eaffe6" stroke="none"/>
